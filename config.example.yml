# ===== LLM 配置 =====
# 支持任意 OpenAI 兼容接口（OpenAI / DeepSeek / Moonshot / 火山方舟 ARK / 本地 vLLM 等）
LLM_API_KEY: ""                                        # 填你的 API key；留空则用回退生成器
LLM_BASE_URL: "https://ark.cn-beijing.volces.com/api/coding/v3"
LLM_MODEL: "ark-code-latest"                           # 或 gpt-4o-mini / deepseek-chat / moonshot-v1-8k 等
LLM_TEMPERATURE: 0.4
LLM_MAX_TOKENS: 2000
LLM_TIMEOUT: 60

# ===== 后端基础设施 =====
REDIS_URL: "redis://127.0.0.1:6379/0"
DATABASE_URL: "sqlite:///./storage/projshow.db"

# ===== 运行模式 =====
# true: 同步直跑（无需 Redis/Celery，适合本地测试）
# false: 走 Celery + Redis（生产用）
EAGER_MODE: true

# ===== 解析限制 =====
MAX_REPO_SIZE_MB: 200
CLONE_DEPTH: 1
CLONE_TIMEOUT: 120
MAX_TREE_ENTRIES: 200
MAX_README_CHARS: 8000

# ===== tForum SSO 集成 =====
# tForum 后端地址，用于调 verifyToken 校验用户 token
TFORUM_BASE_URL: "http://localhost:8081"
# 签会话 cookie 用的密钥（生产请改成随机长串）
SSO_COOKIE_SECRET: "projshow-sso-secret-change-me"
# 会话有效期（秒），默认 7 天
SSO_SESSION_TTL: 604800
# ProjectAgent 对外地址（用于在 tForum 配置外部栏目 URL）
PROJECTAGENT_PUBLIC_URL: "http://localhost:8765"

# ===== 开源CAX工具库同步 =====
# 工具库服务地址（含端口），发布项目后可勾选同步提交；留空则隐藏该功能
TOOLSYNC_BASE_URL: "http://localhost:8082"
# 工具详情页链接模板（与提交 API 地址无关），{name} 会替换为 URL 编码后的工具名
# 留空则用 TOOLSYNC_BASE_URL/tool/{name} 推导
TOOLSYNC_DETAIL_URL: "http://localhost:8082/tool/{name}"

# ===== SkillLab 技能库同步 =====
# SkillLab API base（含端口），发布 Skill 类型项目时同步；留空则隐藏该功能
SKILLLAB_BASE_URL: "http://localhost:3001/api/v1/skill-lab"
# 技能详情页链接模板（与提交 API 地址无关），{name} 会替换为 URL 编码后的技能名
# 留空则用 SKILLLAB_BASE_URL/skill/{name} 推导
SKILLLAB_DETAIL_URL: "http://localhost:3001/skill/{name}"
SKILLLAB_USER_KEY: ""

# ===== 工具/技能库展示（git 只读克隆）=====
# 工具库（isic-awesome-cax）与 SkillLab 仓库的只读克隆地址；留空则不启用 /library 页面
LIBRARY_TOOL_REPO_URL: "https://gitlab.example.com/group/isic-awesome-cax.git"
LIBRARY_TOOL_REPO_BRANCH: ""            # 默认分支可不填
LIBRARY_TOOL_REPO_USER: ""              # developer 账号用户名
LIBRARY_TOOL_REPO_TOKEN: ""             # 密码 / Access Token
LIBRARY_SKILL_REPO_URL: "https://gitlab.example.com/group/skill-repo.git"
LIBRARY_SKILL_REPO_BRANCH: ""           # 如数据在 update-skill 等分支则填写
LIBRARY_SKILL_REPO_USER: ""             # developer 账号用户名
LIBRARY_SKILL_REPO_TOKEN: ""            # 密码 / Access Token
# GitLab push webhook 密钥（填到 GitLab 仓库 Webhook 设置的 Secret token，需两边一致）
LIBRARY_WEBHOOK_SECRET: "change-me-to-a-random-string"
